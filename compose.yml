# PostGIS for development, when lewispb/docker-dev is not available (bin/setup
# uses docker-dev if it can, and this file otherwise). Both serve PostGIS 17 on
# 127.0.0.1:35432.
services:
  db:
    image: postgis/postgis:17-3.6
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:35432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db:
